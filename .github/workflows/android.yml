# Builds the Android app (mobile/) and attaches the APK to a GitHub release.
# Push a tag like android-v1.0.0 to release it, or run it by hand from the Actions tab
# to get an APK as a build artifact without a release.
#
# Signing: phones only install an update signed with the same key as the copy they
# already have, so make one upload key and keep it. Create it once with
#   keytool -genkeypair -v -keystore goal-horn.jks -alias goal-horn -keyalg RSA -keysize 2048 -validity 10000
# then add these repository secrets:
#   ANDROID_KEYSTORE_BASE64   base64 -w0 goal-horn.jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS         goal-horn
#   ANDROID_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key: it installs, but the
# next build won't install over it.
name: Android

on:
  push:
    tags: ['android-v*']
  pull_request:
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm ci --omit=dev
        working-directory: .
      - run: npm run test:remote
      - run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: 1

      - name: Unpack the upload key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/goal-horn.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No upload key in secrets. This APK is signed with a debug key and later builds won't install over it."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK
        working-directory: mobile/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ARGS=""
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            ARGS="-PGOALHORN_STORE_FILE=$RUNNER_TEMP/goal-horn.jks -PGOALHORN_STORE_PASSWORD=$STORE_PASSWORD -PGOALHORN_KEY_ALIAS=$KEY_ALIAS -PGOALHORN_KEY_PASSWORD=$KEY_PASSWORD"
          fi
          ./gradlew assembleRelease --no-daemon $ARGS
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Goal-Horn-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Goal-Horn-android
          path: Goal-Horn-android.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Goal Horn for Android ${TAG#android-v}" --generate-notes --latest=false
          gh release upload "$TAG" "$GITHUB_WORKSPACE/Goal-Horn-android.apk" -R "$GITHUB_REPOSITORY" --clobber
